<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkForge — Deep Purple Tech Preview</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #070812; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .preview-badge {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      padding: 8px 12px;
      border: 1px solid rgba(173,161,255,.26);
      border-radius: 999px;
      background: rgba(13,15,29,.88);
      color: #d9d2ff;
      font: 500 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .05em;
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0,0,0,.35);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <iframe id="app" src="./index.html" title="LinkForge Deep Purple Tech preview"></iframe>
  <div class="preview-badge">DESIGN PREVIEW · DEEP PURPLE TECH</div>
  <script>
    const frame = document.getElementById('app');
    frame.addEventListener('load', () => {
      const doc = frame.contentDocument;
      if (!doc || doc.querySelector('link[data-deep-purple-tech]')) return;
      const theme = doc.createElement('link');
      theme.rel = 'stylesheet';
      theme.href = './deep-purple-tech.css';
      theme.dataset.deepPurpleTech = '';
      doc.head.appendChild(theme);
      doc.documentElement.dataset.design = 'deep-purple-tech';
    });
  </script>
</body>
</html>
