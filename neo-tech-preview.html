<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkForge — Neo-Tech</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#06060c;overflow:hidden}
    iframe{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe id="app" src="./index.html" title="LinkForge Neo-Tech application"></iframe>
  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc||doc.querySelector('link[data-neo-tech-shell]')) return;
      const theme=doc.createElement('link');
      theme.rel='stylesheet';
      theme.href='./neo-tech-shell.css';
      theme.dataset.neoTechShell='';
      doc.head.appendChild(theme);
      doc.documentElement.dataset.design='neo-tech-shell';
    });
  </script>
</body>
</html>
