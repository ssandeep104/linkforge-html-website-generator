name: Bug report
description: Report a parser, generator, or output-template bug
title: "[Bug] "
labels: ["bug", "needs-repro"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce. If pasting an HTML snippet, attach as a file under `tests/fixtures/` or paste in a fenced block.
      placeholder: |
        1. Open Linkforge
        2. Paste the HTML below
        3. Observe: 0 items detected
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: parser, output-template, app-ui, infra
      placeholder: parser
  - type: dropdown
    id: priority
    attributes:
      label: Priority (initial guess — will be triaged)
      options:
        - P0-critical
        - P1-high
        - P2-medium
        - P3-low
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / hypothesis
      description: What you suspect, screenshots, related issues
